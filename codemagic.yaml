
workflows:
  emis-iphone:
    name: EMIS - iPhone 11 IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Check Swift source files
        script: |
          set -e
          echo "Pronalaženje Swift fajlova:"
          find . -type f -name "*.swift" \
            -not -path "./.git/*" \
            -not -path "./build/*"

          if ! find . -type f -name "*.swift" \
            -not -path "./.git/*" \
            -not -path "./build/*" | grep -q .; then
            echo "ERROR: Nema Swift fajlova u projektu!"
            exit 1
          fi

      - name: Generate Xcode project
        script: |
          set -e

          cat > project.yml <<'EOF'
          name: EMIS

          options:
            bundleIdPrefix: com.daninramic
            deploymentTarget:
              iOS: "16.0"

          targets:
            EMIS:
              type: application
              platform: iOS

              sources:
                - path: .
                  includes:
                    - "**/*.swift"
                  excludes:
                    - "**/.git/**"
                    - "**/build/**"
                    - "**/Pods/**"

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.daninramic.emis
                  PRODUCT_NAME: EMIS
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

          EOF

          xcodegen generate

      - name: Build for physical iPhone
        script: |
          set -e

          xcodebuild clean build \
            -project EMIS.xcodeproj \
            -scheme EMIS \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify application executable
        script: |
          set -e

          APP="build/Build/Products/Debug-iphoneos/EMIS.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: EMIS.app nije pronađen!"
            exit 1
          fi

          if [ ! -f "$APP/EMIS" ]; then
            echo "ERROR: Nedostaje izvršna datoteka EMIS!"
            echo "Sadržaj aplikacije:"
            ls -la "$APP"
            exit 1
          fi

          echo "Uspješno pronađena izvršna datoteka EMIS!"

      - name: Package unsigned IPA
        script: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R build/Build/Products/Debug-iphoneos/EMIS.app Payload/

          mkdir -p build/ipa

          cd Payload/..
          zip -qr build/ipa/EMIS-unsigned.ipa Payload

          echo "IPA uspješno napravljen:"
          ls -lh build/ipa/EMIS-unsigned.ipa

    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
