
workflows:
  emis-iphone:
    name: EMIS - iPhone 11 IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          set -e

          cat > project.yml <<'EOF'
          name: EMIS
          options:
            bundleIdPrefix: com.daninramic
            deploymentTarget:
              iOS: "16.0"
          targets:
            EMIS:
              type: application
              platform: iOS
              sources:
                - path: .
                  excludes:
                    - "**/.git/**"
                    - "**/build/**"
                    - "**/Pods/**"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.daninramic.emis
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

          xcodegen generate

      - name: Build for physical iPhone
        script: |
          set -e

          xcodebuild build \
            -project EMIS.xcodeproj \
            -scheme EMIS \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        script: |
          set -e

          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/EMIS.app Payload/

          mkdir -p build/ipa
          /usr/bin/zip -r build/ipa/EMIS-unsigned.ipa Payload

    artifacts:
      - build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
