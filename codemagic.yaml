
workflows:
  emis-ios-test:
    name: EMIS iOS - Automatic Project Generation
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          set -e

          cat > project.yml <<'EOF'
          name: EMIS
          options:
            bundleIdPrefix: com.daninramic
            deploymentTarget:
              iOS: "16.0"

          targets:
            EMIS:
              type: application
              platform: iOS
              sources:
                - path: .
                  excludes:
                    - "**/.git/**"
                    - "**/build/**"
                    - "**/Pods/**"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.daninramic.emis
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

          xcodegen generate

          echo "Generated Xcode project:"
          ls -la EMIS.xcodeproj

      - name: Build EMIS for iOS Simulator
        script: |
          set -e

          xcodebuild build \
            -project EMIS.xcodeproj \
            -scheme EMIS \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
