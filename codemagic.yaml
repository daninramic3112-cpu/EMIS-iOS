
workflows:
  emis-ios-test:
    name: EMIS iOS - Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Find Xcode project and scheme
        script: |
          set -e

          PROJECT=$(find "$CM_BUILD_DIR" -maxdepth 4 -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj file found!"
            exit 1
          fi

          echo "Found project: $PROJECT"

          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          schemes=data.get("project",{}).get("schemes",[])
          if not schemes:
              print("ERROR: No Xcode schemes found", file=sys.stderr)
              sys.exit(1)
          print(schemes[0])
          ')

          echo "Found scheme: $SCHEME"

          echo "$PROJECT" > /tmp/emis_project.txt
          echo "$SCHEME" > /tmp/emis_scheme.txt

      - name: Build EMIS for iOS Simulator
        script: |
          set -e

          PROJECT=$(cat /tmp/emis_project.txt)
          SCHEME=$(cat /tmp/emis_scheme.txt)

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

